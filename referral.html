  <meta name="twitter:card" content="summary_large_image">

  <style>
    html,body{height:100%;margin:0;background:#050b1d;color:#fff;font-family:Arial,sans-serif}
    body{display:grid;place-items:center;text-align:center;padding:24px;min-height:100svh}
    .card{width:min(760px,100%);padding:22px;border-radius:22px;background:#0a1530;border:1px solid #2d477d;box-shadow:0 20px 60px #0008}
    .preview-frame{width:100%;aspect-ratio:1536/1024;overflow:hidden;border-radius:16px;margin-bottom:20px;background:#061027}
    img{display:block;width:100%;height:100%;object-fit:cover;object-position:center}
    h1{font-size:26px;margin:0 0 10px}
    p{color:#b8c5dc;line-height:1.6}
    a{display:inline-block;margin-top:10px;padding:14px 22px;border-radius:11px;color:#fff;text-decoration:none;font-weight:700;background:linear-gradient(90deg,#376cff,#8539ed)}
  </style>
</head>
<body>
  <main class="card">
    <div class="preview-frame"><img src="referral-preview.png" width="1536" height="1024" alt="InternsForge Internship Programme 2026 referral preview"></div>
    <h1>Opening the application…</h1>
    <p>Build practical skills, gain experience and invite your friends through your personal referral link.</p>
    <a id="continueLink" href="/#apply">Continue to Application</a>
  </main>

  <script>
    (function () {
      const query = new URLSearchParams(location.search);
      const ref = (query.get("ref") || "").trim();
      const target = ref ? `/?ref=${encodeURIComponent(ref)}#apply` : "/#apply";
      document.getElementById("continueLink").href = target;
      // Keep this crawler-friendly page available long enough for social preview bots.
      // Human visitors are redirected with JavaScript after a brief delay.
      window.setTimeout(() => location.replace(target), 1800);
    })();
  </script>
</body>
</html>
